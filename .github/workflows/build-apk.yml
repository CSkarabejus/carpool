name: Build SplitRide APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Offline Web Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html style.css app.js qrcode.min.js manifest.json favicon.png icon-192.png icon-512.png icon.svg android/app/src/main/assets/

      - name: Build APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/SplitRide.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SplitRide-Clean-APK
          path: release-output/SplitRide.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "SplitRide APK v1.0.${{ github.run_number }}"
          body: |
            🚗 **SplitRide Clean Android APK**
            - 100% Ad-Free
            - 100% Offline (No servers required)
            - Built for Poco X4 Pro
          files: release-output/SplitRide.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
